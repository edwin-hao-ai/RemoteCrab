name: RemoteCrabCapture
options:
  bundleIdPrefix: com.remotecrab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: DDG3CJL762
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  RemoteCrabCore:
    path: RemoteCrabCore

targets:
  RemoteCrabCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RemoteCrabCapture
        excludes:
          - "Info.plist"
    resources: []
    dependencies:
      - package: RemoteCrabCore
        product: RemoteCrabCore
    info:
      path: RemoteCrabCapture/Info.plist
      properties:
        CFBundleDisplayName: RemoteCrab
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2026091802"
        # Apple export compliance: the app uses HTTPS only. Kept here (not
        # only in the checked-in plist) because xcodegen rewrites the plist
        # from these properties on every `xcodegen generate`.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # xcodegen rewrites Info.plist from these properties alone —
        # keep CFBundleLocalizations here or regeneration drops it.
        CFBundleLocalizations:
          - en
          - zh-Hans
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: RemoteCrab turns your iPhone into a WiFi camera for your Mac.
        NSMicrophoneUsageDescription: RemoteCrab streams your iPhone microphone to your Mac.
        NSSpeechRecognitionUsageDescription: RemoteCrab recognizes your speech on-device to type into your Mac.
        NSPhotoLibraryUsageDescription: RemoteCrab reads your latest screenshot to send it to your Mac.
        NSLocalNetworkUsageDescription: RemoteCrab discovers your Mac on the local WiFi network.
        NSBonjourServices:
          - _remotecrab._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeCapture
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DDG3CJL762