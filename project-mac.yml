name: iBridgeReceiver
options:
  bundleIdPrefix: com.ibridge
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: "5XNDF727Y6"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  iBridgeCore:
    path: iBridgeCore

targets:
  iBridgeReceiver:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeReceiver
        excludes:
          - "Info.plist"
    resources: []
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
      - target: iBridgeCameraExtension
        embed: true
        codeSignOnCopy: true
      - target: iBridgeAudioExtension
        embed: true
        codeSignOnCopy: true
    info:
      path: iBridgeReceiver/Info.plist
      properties:
        CFBundleDisplayName: iBridge
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: iBridge discovers your iPhone on the local WiFi network.
        NSBonjourServices:
          - _ibridge._tcp
        NSMicrophoneUsageDescription: iBridge uses your Mac microphone for audio routing when the iPhone mic is unavailable.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: iBridgeReceiver/iBridgeReceiver.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # Camera Extension target — exposes iBridge as a virtual webcam
  # via CoreMediaIO (CMIO). When wired into the host via
  # "Embed App Extensions", other Mac apps can pick "iBridge Camera"
  # as their video input.
  iBridgeCameraExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeCameraExtension/Sources
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
    info:
      path: iBridgeCameraExtension/Info.plist
      properties:
        CFBundleDisplayName: iBridge Camera
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.cmioextension-provider
          NSExtensionPrincipalClass: CameraExtensionProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver.Camera
        INFOPLIST_FILE: iBridgeCameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iBridgeCameraExtension/CameraExtension.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # Audio Unit extension target — exposes iBridge as a virtual mic
  # via CoreAudio. When wired into the host, other Mac apps can pick
  # "iBridge Microphone" as their audio input.
  iBridgeAudioExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeAudioExtension/Sources
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
    info:
      path: iBridgeAudioExtension/Info.plist
      properties:
        CFBundleDisplayName: iBridge Microphone
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.audiounit
          NSExtensionPrincipalClass: iBridgeAudioFactory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver.Audio
        INFOPLIST_FILE: iBridgeAudioExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iBridgeAudioExtension/AudioExtension.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"