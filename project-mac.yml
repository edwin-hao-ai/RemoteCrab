name: RemoteCrabReceiver
options:
  bundleIdPrefix: com.remotecrab
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: "5XNDF727Y6"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  RemoteCrabCore:
    path: RemoteCrabCore

targets:
  RemoteCrabReceiver:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RemoteCrabReceiver
        excludes:
          - "Info.plist"
      # Embedded one-click installer for the virtual microphone,
      # opened from the setup assistant / Preferences. Built by
      # scripts/build-mic-driver-pkg.sh (dist/ is gitignored).
      - path: dist/RemoteCrabMicrophone.pkg
        buildPhase: resources
    resources: []
    dependencies:
      - package: RemoteCrabCore
        product: RemoteCrabCore
      - target: RemoteCrabCameraExtension
        embed: true
        codeSign: true
      - target: RemoteCrabAudioExtension
        embed: true
        codeSign: true
      # Built with the app, but installed to /Library/Audio/Plug-Ins/HAL
      # by scripts/install-mic-driver.sh — not embedded in the bundle.
      - target: RemoteCrabMicrophone
        embed: false
        codeSign: true
    info:
      path: RemoteCrabReceiver/Info.plist
      properties:
        CFBundleDisplayName: RemoteCrab
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: RemoteCrab discovers your iPhone on the local WiFi network.
        NSBonjourServices:
          - _remotecrab._tcp
        NSMicrophoneUsageDescription: RemoteCrab uses your Mac microphone for audio routing when the iPhone mic is unavailable.
        NSSystemExtensionUsageDescription: RemoteCrab installs a camera extension so other apps can use your iPhone as a webcam.
        # xcodegen rewrites Info.plist from these properties alone —
        # keep CFBundleLocalizations here or regeneration drops it.
        CFBundleLocalizations:
          - en
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecrab.RemoteCrabReceiver
        PRODUCT_NAME: RemoteCrab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: RemoteCrabReceiver/RemoteCrabReceiver.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # Camera Extension target — exposes RemoteCrab as a virtual webcam
  # via CoreMediaIO (CMIO). CMIO camera extensions are SYSTEM
  # extensions: this target builds as a .systemextension and is
  # embedded into Contents/Library/SystemExtensions of the host via
  # an "Embed System Extensions" copy-files phase (xcodegen emits it
  # automatically for a `system-extension` dependency with
  # `embed: true`). The CMIOExtensionMachServiceName lives in the
  # target's `info.properties` below — this yml is the source of truth.
  RemoteCrabCameraExtension:
    type: system-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RemoteCrabCameraExtension/Sources
    dependencies:
      - package: RemoteCrabCore
        product: RemoteCrabCore
    info:
      path: RemoteCrabCameraExtension/Info.plist
      properties:
        CFBundleDisplayName: RemoteCrab Camera
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "8"
        CFBundlePackageType: SYSX
        CMIOExtension:
          CMIOExtensionMachServiceName: 5XNDF727Y6.com.remotecrab.RemoteCrabReceiver.Camera
        NSSystemExtensionUsageDescription: RemoteCrab uses your iPhone as a camera for this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecrab.RemoteCrabReceiver.Camera
        PRODUCT_NAME: com.remotecrab.RemoteCrabReceiver.Camera
        INFOPLIST_FILE: RemoteCrabCameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: RemoteCrabCameraExtension/CameraExtension.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # CoreAudio HAL plug-in — the REAL virtual microphone. An AUv3 (below)
  # is only a DAW-hosted plugin and never appears as a system input
  # device; a HAL AudioServerPlugIn is what BlackHole/Loopback ship.
  # Built as an mh_bundle `.driver`, installed to
  # /Library/Audio/Plug-Ins/HAL by scripts/install-mic-driver.sh.
  RemoteCrabMicrophone:
    type: bundle
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RemoteCrabMicDriver
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
    info:
      path: RemoteCrabMicDriver/Info.plist
      properties:
        CFBundleDisplayName: RemoteCrab Microphone
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        CFBundlePackageType: BNDL
        CFPlugInFactories:
          "5B8E6A1C-9C4D-4E3F-9A1B-3D2E4F5A6B7C": RemoteCrabMicrophone_Create
        CFPlugInTypes:
          "443ABAB8-E7B3-491A-B985-BEB9187030DB":
            - "5B8E6A1C-9C4D-4E3F-9A1B-3D2E4F5A6B7C"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecrab.RemoteCrabMicrophone
        PRODUCT_NAME: RemoteCrabMicrophone
        WRAPPER_EXTENSION: driver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # Audio Unit extension target — DAW-hosted only (kept for reference;
  # does NOT show up as a system input device).
  RemoteCrabAudioExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RemoteCrabAudioExtension/Sources
    dependencies:
      - package: RemoteCrabCore
        product: RemoteCrabCore
    info:
      path: RemoteCrabAudioExtension/Info.plist
      properties:
        CFBundleDisplayName: RemoteCrab Microphone
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.audiounit
          NSExtensionPrincipalClass: RemoteCrabAudioFactory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecrab.RemoteCrabReceiver.Audio
        INFOPLIST_FILE: RemoteCrabAudioExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: RemoteCrabAudioExtension/AudioExtension.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"