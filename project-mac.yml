name: iBridgeReceiver
options:
  bundleIdPrefix: com.ibridge
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  iBridgeCore:
    path: iBridgeCore

targets:
  iBridgeReceiver:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeReceiver
        excludes:
          - "Info.plist"
    resources: []
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
    info:
      path: iBridgeReceiver/Info.plist
      properties:
        CFBundleDisplayName: iBridge
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: iBridge discovers your iPhone on the local WiFi network.
        NSBonjourServices:
          - _ibridge._tcp
        NSMicrophoneUsageDescription: iBridge uses your Mac microphone for audio routing when the iPhone mic is unavailable.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: iBridgeReceiver/iBridgeReceiver.entitlements