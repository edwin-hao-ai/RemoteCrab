name: iBridgeReceiver
options:
  bundleIdPrefix: com.ibridge
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: "5XNDF727Y6"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  iBridgeCore:
    path: iBridgeCore

targets:
  iBridgeReceiver:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeReceiver
        excludes:
          - "Info.plist"
      # Embedded one-click installer for the virtual microphone,
      # opened from the setup assistant / Preferences. Built by
      # scripts/build-mic-driver-pkg.sh (dist/ is gitignored).
      - path: dist/FamiliarMicrophone.pkg
        buildPhase: resources
    resources: []
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
      - target: iBridgeCameraExtension
        embed: true
        codeSign: true
      - target: iBridgeAudioExtension
        embed: true
        codeSign: true
      # Built with the app, but installed to /Library/Audio/Plug-Ins/HAL
      # by scripts/install-mic-driver.sh — not embedded in the bundle.
      - target: iBridgeMicrophone
        embed: false
        codeSign: true
    info:
      path: iBridgeReceiver/Info.plist
      properties:
        CFBundleDisplayName: Familiar
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: Familiar discovers your iPhone on the local WiFi network.
        NSBonjourServices:
          - _ibridge._tcp
        NSMicrophoneUsageDescription: Familiar uses your Mac microphone for audio routing when the iPhone mic is unavailable.
        NSSystemExtensionUsageDescription: Familiar installs a camera extension so other apps can use your iPhone as a webcam.
        # xcodegen rewrites Info.plist from these properties alone —
        # keep CFBundleLocalizations here or regeneration drops it.
        CFBundleLocalizations:
          - en
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver
        PRODUCT_NAME: Familiar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: iBridgeReceiver/iBridgeReceiver.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # Camera Extension target — exposes iBridge as a virtual webcam
  # via CoreMediaIO (CMIO). CMIO camera extensions are SYSTEM
  # extensions: this target builds as a .systemextension and is
  # embedded into Contents/Library/SystemExtensions of the host via
  # an "Embed System Extensions" copy-files phase (xcodegen emits it
  # automatically for a `system-extension` dependency with
  # `embed: true`). The CMIOExtensionMachServiceName lives in the
  # target's `info.properties` below — this yml is the source of truth.
  iBridgeCameraExtension:
    type: system-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeCameraExtension/Sources
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
    info:
      path: iBridgeCameraExtension/Info.plist
      properties:
        CFBundleDisplayName: Familiar Camera
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "6"
        CFBundlePackageType: SYSX
        CMIOExtension:
          CMIOExtensionMachServiceName: 5XNDF727Y6.com.ibridge.iBridgeReceiver.Camera
        NSSystemExtensionUsageDescription: Familiar uses your iPhone as a camera for this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver.Camera
        PRODUCT_NAME: com.ibridge.iBridgeReceiver.Camera
        INFOPLIST_FILE: iBridgeCameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iBridgeCameraExtension/CameraExtension.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # CoreAudio HAL plug-in — the REAL virtual microphone. An AUv3 (below)
  # is only a DAW-hosted plugin and never appears as a system input
  # device; a HAL AudioServerPlugIn is what BlackHole/Loopback ship.
  # Built as an mh_bundle `.driver`, installed to
  # /Library/Audio/Plug-Ins/HAL by scripts/install-mic-driver.sh.
  iBridgeMicrophone:
    type: bundle
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeMicDriver
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
    info:
      path: iBridgeMicDriver/Info.plist
      properties:
        CFBundleDisplayName: Familiar Microphone
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        CFBundlePackageType: BNDL
        CFPlugInFactories:
          "5B8E6A1C-9C4D-4E3F-9A1B-3D2E4F5A6B7C": iBridgeMicrophone_Create
        CFPlugInTypes:
          "443ABAB8-E7B3-491A-B985-BEB9187030DB":
            - "5B8E6A1C-9C4D-4E3F-9A1B-3D2E4F5A6B7C"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeMicrophone
        PRODUCT_NAME: iBridgeMicrophone
        WRAPPER_EXTENSION: driver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"

  # Audio Unit extension target — DAW-hosted only (kept for reference;
  # does NOT show up as a system input device).
  iBridgeAudioExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: iBridgeAudioExtension/Sources
    dependencies:
      - package: iBridgeCore
        product: iBridgeCore
    info:
      path: iBridgeAudioExtension/Info.plist
      properties:
        CFBundleDisplayName: Familiar Microphone
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.audiounit
          NSExtensionPrincipalClass: iBridgeAudioFactory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibridge.iBridgeReceiver.Audio
        INFOPLIST_FILE: iBridgeAudioExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iBridgeAudioExtension/AudioExtension.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5XNDF727Y6"