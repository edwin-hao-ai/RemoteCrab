<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12223C"/>
      <stop offset="0.55" stop-color="#0A1426"/>
      <stop offset="1" stop-color="#05070F"/>
    </linearGradient>

    <filter id="blurAmb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blurGlass" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blur4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur8" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur16" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur24" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <!-- coral crab gradient -->
    <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="0.5" stop-color="#F95F3C"/>
      <stop offset="1" stop-color="#E8432D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="shellClip">
      <rect x="297" y="430" width="430" height="270" rx="130"/>
    </clipPath>
  </defs>

  <!-- ======================= background ======================= -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g id="ambience">
    <circle cx="300" cy="270" r="240" fill="#2AA9E0" opacity="0.5" filter="url(#blurAmb)"/>
    <circle cx="750" cy="770" r="270" fill="#6C4BD9" opacity="0.45" filter="url(#blurAmb)"/>
    <circle cx="820" cy="240" r="160" fill="#1E6FB8" opacity="0.4" filter="url(#blurAmb)"/>
    <circle cx="240" cy="780" r="180" fill="#F95F3C" opacity="0.22" filter="url(#blurAmb)"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="512" cy="812" rx="230" ry="20" fill="#000000" opacity="0.45" filter="url(#blur24)"/>

  <!-- ======================= stubby legs ======================= -->
  <g fill="none" stroke="#D94735" stroke-width="26" stroke-linecap="round">
    <path d="M 388 682 L 350 748"/>
    <path d="M 474 692 L 456 762"/>
    <path d="M 636 682 L 674 748"/>
    <path d="M 550 692 L 568 762"/>
  </g>
  <!-- cyan mechanical knee joints (the cyber hint) -->
  <g fill="#4CC9F0">
    <circle cx="369" cy="715" r="10"/>
    <circle cx="465" cy="727" r="10"/>
    <circle cx="655" cy="715" r="10"/>
    <circle cx="559" cy="727" r="10"/>
  </g>
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="366" cy="712" r="3.5"/>
    <circle cx="462" cy="724" r="3.5"/>
    <circle cx="652" cy="712" r="3.5"/>
    <circle cx="556" cy="724" r="3.5"/>
  </g>

  <!-- ======================= raised pincer claws ======================= -->
  <!-- arms -->
  <g fill="none" stroke="url(#shellGrad)" stroke-width="42" stroke-linecap="round">
    <path d="M 330 520 C 285 505 258 478 244 440"/>
    <path d="M 694 520 C 739 505 766 478 780 440"/>
  </g>
  <!-- left pincer (Pac-Man bite toward the top middle) -->
  <path d="M 222 378 L 228 304 A 74 74 0 1 0 294 359 Z" fill="url(#shellGrad)"/>
  <!-- right pincer -->
  <path d="M 802 378 L 796 304 A 74 74 0 1 1 730 359 Z" fill="url(#shellGrad)"/>
  <!-- claw speculars -->
  <path d="M 178 330 A 62 62 0 0 1 214 306" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" filter="url(#blur4)"/>
  <path d="M 846 330 A 62 62 0 0 0 810 306" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" filter="url(#blur4)"/>

  <!-- ======================= glass carapace ======================= -->
  <g clip-path="url(#shellClip)">
    <rect x="297" y="430" width="430" height="270" fill="url(#shellGrad)"/>
    <!-- refracted ambience through the tinted glass -->
    <use href="#ambience" filter="url(#blurGlass)" opacity="0.22"/>
    <!-- frost -->
    <rect x="297" y="430" width="430" height="270" fill="#FFFFFF" opacity="0.08"/>
    <!-- diagonal sheen -->
    <polygon points="297,430 565,430 405,700 297,700" fill="url(#sheen)"/>
    <!-- bottom inner shadow -->
    <rect x="297" y="636" width="430" height="64" fill="#7A1408" opacity="0.25" filter="url(#blur16)"/>
  </g>
  <!-- rim + specular -->
  <rect x="297" y="430" width="430" height="270" rx="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"/>
  <path d="M 402 437 L 622 437" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" filter="url(#blur4)"/>
  <path d="M 402 437 L 622 437" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
  <path d="M 306 492 L 306 600" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" filter="url(#blur4)"/>
  <!-- cyan neon bottom rim -->
  <path d="M 412 694 L 612 694" stroke="#7BDFF2" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" filter="url(#blur4)"/>

  <!-- ======================= face ======================= -->
  <!-- big close-set dark eyes with double highlights -->
  <circle cx="443" cy="510" r="42" fill="#0B1526"/>
  <circle cx="581" cy="510" r="42" fill="#0B1526"/>
  <circle cx="457" cy="494" r="14" fill="#FFFFFF"/>
  <circle cx="595" cy="494" r="14" fill="#FFFFFF"/>
  <circle cx="431" cy="524" r="5.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="569" cy="524" r="5.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- blush -->
  <ellipse cx="378" cy="566" rx="26" ry="14" fill="#FFB09A" opacity="0.6" filter="url(#blur8)"/>
  <ellipse cx="646" cy="566" rx="26" ry="14" fill="#FFB09A" opacity="0.6" filter="url(#blur8)"/>

  <!-- smile -->
  <path d="M 488 585 Q 512 605 536 585" stroke="#0B1526" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- tiny glass sparkle -->
  <path d="M 676 452 L 681 467 L 696 472 L 681 477 L 676 492 L 671 477 L 656 472 L 671 467 Z" fill="#FFFFFF" opacity="0.85"/>
</svg>
