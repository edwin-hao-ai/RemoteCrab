<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Monochrome, transparent-background glyph of the RemoteCrab
       coral-crab mark, for the macOS menu bar as a TEMPLATE image
       (macOS tints it for light/dark automatically; the eye holes
       stay transparent so the face reads at 18 pt). -->
  <defs>
    <mask id="face">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="443" cy="540" r="46" fill="#000000"/>
      <circle cx="581" cy="540" r="46" fill="#000000"/>
    </mask>
  </defs>
  <g fill="#000000" mask="url(#face)">
    <!-- carapace -->
    <rect x="297" y="460" width="430" height="260" rx="130"/>
    <!-- arms -->
    <g fill="none" stroke="#000000" stroke-width="46" stroke-linecap="round">
      <path d="M 330 560 C 285 545 258 518 244 480"/>
      <path d="M 694 560 C 739 545 766 518 780 480"/>
    </g>
    <!-- raised pincers -->
    <path d="M 222 428 L 228 354 A 74 74 0 1 0 294 409 Z"/>
    <path d="M 802 428 L 796 354 A 74 74 0 1 1 730 409 Z"/>
    <!-- stubby legs -->
    <g fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round">
      <path d="M 388 702 L 350 768"/>
      <path d="M 474 712 L 456 782"/>
      <path d="M 636 702 L 674 768"/>
      <path d="M 550 712 L 568 782"/>
    </g>
  </g>
</svg>
