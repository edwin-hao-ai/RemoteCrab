<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Monochrome, transparent-background glyph of the RemoteCrab
       cyber-crab mark, for the macOS menu bar as a TEMPLATE image
       (macOS tints it for light/dark automatically). -->
  <g fill="none" stroke="#000000" stroke-width="66" stroke-linecap="round" stroke-linejoin="round">
    <!-- carapace dome -->
    <path d="M 262 604 A 250 230 0 0 1 762 604"/>
    <!-- eye stalks -->
    <path d="M 452 428 L 438 330"/>
    <path d="M 572 428 L 586 330"/>
    <!-- claws -->
    <path d="M 262 442 A 98 98 0 1 0 266 578"/>
    <path d="M 762 442 A 98 98 0 1 1 758 578"/>
    <!-- legs -->
    <path d="M 376 652 L 320 736"/>
    <path d="M 482 664 L 448 752"/>
    <path d="M 648 652 L 704 736"/>
    <path d="M 542 664 L 576 752"/>
  </g>
  <g fill="#000000">
    <circle cx="434" cy="278" r="46"/>
    <circle cx="590" cy="278" r="46"/>
  </g>
</svg>
