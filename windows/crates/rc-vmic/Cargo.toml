[package]
name = "rc-vmic"
description = "RemoteCrab for Windows — virtual microphone ring + endpoint probe (receiver half of the rc-vmic driver)."
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_Media_Audio",
] }
