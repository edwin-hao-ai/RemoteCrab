[package]
name = "rc-app"
description = "RemoteCrab for Windows — receiver app (session + input injection + status)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "remotecrab"
path = "src/main.rs"

[features]
default = []
# Builds the offline self-tests (`--selftest`, `--preview-selftest`) into the
# binary. Off by default so a shipped build contains no fake sender.
selftest = ["dep:rc-testkit"]

[dependencies]
rc-protocol.workspace = true
rc-discovery.workspace = true
rc-net.workspace = true
rc-input.workspace = true
rc-render.workspace = true
rc-audio.workspace = true
# System-audio capture for "use the iPhone as the speaker". A plain dependency,
# not target-gated: the COM layer inside it is `cfg(windows)`, so the crate
# compiles (and its pure logic is tested) on the Mac that runs the suite too.
rc-loopback.workspace = true
rc-os.workspace = true
rc-record.workspace = true
rc-mirror.workspace = true
# Extended display: the control pipe + frame ring the IddCx driver shares.
# Non-target-gated: its Windows code is `cfg(windows)` and the rest stubs to
# "not available", so this crate still builds on the Mac that runs the suite.
rc-vdisplay.workspace = true
png.workspace = true
# A fake iPhone on localhost, for `--selftest` / `--preview-selftest`.
# Optional and OFF by default: a release build must not ship a second copy
# of the sender that a stray flag or a curious user can start. The
# self-tests still work in a dev build, and a release build can be asked
# for them with `--features selftest`.
rc-testkit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
ureq.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows notification capture. Windows-only because its `windows` features
# are WinRT; see that crate's manifest.
rc-notify = { path = "../rc-notify" }
rc-vcam = { path = "../rc-vcam" }
# Not used as a library: depending on it makes Cargo emit
# `rc-vcam-source.dll` into the same `target/<profile>/` directory as
# `remotecrab.exe`, which is where `rc_vcam::install_source` looks for it.
rc-vcam-source = { path = "../rc-vcam-source" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # Reading the process integrity level — the Windows stand-in for the
    # Accessibility grant, and the reason the first-run check exists.
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    # Fluent backdrop (Mica/Acrylic) + rounded corners + the immersive dark
    # title bar. This is the Windows 11 material, the closest native analogue
    # of the Mac side's Liquid Glass (`DWMWA_SYSTEMBACKDROP_TYPE` etc.).
    "Win32_Graphics_Dwm",
    # The native windows follow the system light/dark setting, which lives in
    # the registry under `Themes\Personalize`.
    "Win32_System_Registry",
    # Owner-drawn buttons: `DRAWITEMSTRUCT` and the `ODS_*` state flags.
    "Win32_UI_Controls",
    # Telling "double-clicked from Explorer" (we own the only console, so hide
    # it) apart from "run from a shell" (a shell is attached, so leave it).
    "Win32_System_Console",
] }

[build-dependencies]
# Host-side: `build.rs` runs on the machine doing the compiling, and it is the
# target that has to *receive* the resource. Gating it on `cfg(windows)` here
# would silently drop the icon on every cross-build from a Mac.
winres.workspace = true
