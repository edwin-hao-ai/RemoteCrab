[package]
name = "rc-render"
description = "RemoteCrab video preview on Windows — H.264 decode (OpenH264) + a window."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rc-protocol.workspace = true
openh264 = "0.9"
minifb = "0.28"

# Dev-only: the forensics probe talks to a real phone. Not a normal dependency,
# because nothing that links `rc-render` should drag in a TCP client.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
