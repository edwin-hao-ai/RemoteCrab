# RemoteCrab for Windows — independent Rust workspace.
#
# HARD RULE: this tree is standalone. It MUST NOT modify or depend on the
# Swift sources (RemoteCrabCore / RemoteCrabCapture / RemoteCrabReceiver).
# It is a *compatible* re-implementation of the Mac receiver role, speaking
# the exact same wire protocol the iOS app already sends.
[workspace]
resolver = "2"
members = [
    "crates/rc-protocol",
    "crates/rc-discovery",
    "crates/rc-net",
    "crates/rc-input",
    "crates/rc-render",
    "crates/rc-audio",
    "crates/rc-os",
    "crates/rc-testkit",
    "crates/rc-record",
    "crates/rc-mirror",
    "crates/rc-vcam",
    "crates/rc-vcam-source",
    "crates/rc-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rc-protocol = { path = "crates/rc-protocol" }
rc-discovery = { path = "crates/rc-discovery" }
rc-net = { path = "crates/rc-net" }
rc-input = { path = "crates/rc-input" }
rc-render = { path = "crates/rc-render" }
rc-os = { path = "crates/rc-os" }
rc-audio = { path = "crates/rc-audio" }
rc-testkit = { path = "crates/rc-testkit" }
rc-record = { path = "crates/rc-record" }
rc-mirror = { path = "crates/rc-mirror" }
rc-vcam = { path = "crates/rc-vcam" }
rc-app = { path = "crates/rc-app" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
jpeg-encoder = "0.7"
png = "0.17"
mp4 = "0.14"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
mdns-sd = "0.21"

# Release tuning. The receiver ships to end users, so the binary should be as
# small and as fast as it reasonably can be:
# - `lto`/`codegen-units` give the cross-crate inlining that the session hot
#   path (H.264 NAL dispatch at 30 fps) benefits from.
# - `panic = "abort"` would shrink it further, but a tray app that vanishes
#   with no dialog is a worse failure mode than a crash dialog, and the code
#   relies on catch_unwind-free panics not being turned into process death in
#   the mirror thread — so it is deliberately off.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
